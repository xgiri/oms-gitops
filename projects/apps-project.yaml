apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: OMS application tier. Namespaced only — no cluster-scoped resources.
  sourceRepos:
    - https://github.com/xgiri/oms-gitops.git
    - https://github.com/xgiri/oms-backend.git
    - https://github.com/xgiri/oms-gateway.git
    - https://github.com/xgiri/oms-bff.git
    - https://github.com/xgiri/oms-product-service.git
    - https://github.com/xgiri/oms-customer-service.git
    - https://github.com/xgiri/oms-shipment-service.git
  destinations:
    - namespace: oms-core
      server: '*'
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
