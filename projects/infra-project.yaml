# Scopes what infra Applications are allowed to touch. Apply once, or add
# it to bootstrap/children if you want Argo CD to manage its own Projects too.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: argocd
spec:
  description: Cluster-wide infra components (cert-manager, ingress, secrets sync, etc.)
  sourceRepos:
    - https://github.com/org/gitops.git
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
