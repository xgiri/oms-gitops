# Scope for the 4 root Applications (one per environment). Deliberately the
# narrowest project of all — it can only touch other Application objects,
# never a workload directly.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Scope for the per-environment root (app-of-apps) Applications.
  sourceRepos:
    - https://github.com/xgiri/oms-gitops.git
  destinations:
    - namespace: argocd
      server: '*'
  clusterResourceWhitelist:
    - group: 'argoproj.io'
      kind: Application
