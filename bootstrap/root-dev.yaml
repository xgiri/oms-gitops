# dev IS Docker Desktop's Kubernetes — the same cluster Argo CD itself runs
# in — so this targets Argo CD's built-in 'in-cluster' destination, no
# `argocd cluster add` needed. Apply once:
#   kubectl apply -f bootstrap/root-dev.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/xgiri/oms-gitops.git
    targetRevision: main
    path: bootstrap/children/dev
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
