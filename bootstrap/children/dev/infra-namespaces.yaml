apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: infra
  source:
    repoURL: https://github.com/xgiri/oms-gitops.git
    targetRevision: main
    path: environments/dev/infra/namespaces
  destination:
    name: in-cluster   # Argo CD's own cluster — dev IS Docker Desktop, no `argocd cluster add` needed
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
