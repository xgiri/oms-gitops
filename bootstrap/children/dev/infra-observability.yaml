apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: infra
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "66.2.1"
      helm:
        valueFiles:
          - $values/environments/dev/infra/observability/values.yaml
    - repoURL: https://github.com/xgiri/oms-gitops.git
      targetRevision: main
      ref: values
  destination:
    name: in-cluster   # Argo CD's own cluster — dev IS Docker Desktop, no `argocd cluster add` needed
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # kube-prometheus-stack's Prometheus/Alertmanager/PrometheusRule CRDs
      # are the textbook example of hitting Kubernetes' 262144-byte
      # annotation limit under client-side apply — same root cause as
      # KEDA's scaledjobs.keda.sh (see infra-keda.yaml). Server-side apply
      # avoids it entirely; adding this proactively rather than waiting
      # for the same failure here.
      - ServerSideApply=true
