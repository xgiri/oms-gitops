apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: infra
  sources:
    - repoURL: https://kedacore.github.io/charts
      chart: keda
      targetRevision: "2.16.0"
      helm:
        valueFiles:
          - $values/environments/dev/infra/keda/values.yaml
    - repoURL: https://github.com/xgiri/oms-gitops.git
      targetRevision: main
      ref: values
  destination:
    name: in-cluster   # Argo CD's own cluster — dev IS Docker Desktop, no `argocd cluster add` needed
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # KEDA's scaledjobs.keda.sh CRD has a large enough embedded OpenAPI
      # schema that client-side apply's kubectl.kubernetes.io/last-applied-
      # configuration annotation exceeds Kubernetes' 262144-byte annotation
      # limit ("metadata.annotations: Too long"). Server-side apply doesn't
      # use that annotation at all, which avoids the problem entirely — a
      # known issue with several large-schema CRD charts (KEDA, Istio,
      # Cilium), not specific to this repo.
      - ServerSideApply=true
