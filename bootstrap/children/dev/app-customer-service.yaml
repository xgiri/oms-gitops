apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-customer-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  project: apps
  source:
    repoURL: https://github.com/xgiri/oms-gitops.git
    targetRevision: main
    path: environments/dev/apps/customer-service
  destination:
    name: in-cluster   # Argo CD's own cluster — dev IS Docker Desktop, no `argocd cluster add` needed
    namespace: oms-core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
