apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-oms-main
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: apps
  source:
    repoURL: https://github.com/xgiri/oms-gitops.git
    targetRevision: main
    path: environments/dev/apps/oms-main
  destination:
    name: in-cluster   # Argo CD's own cluster — dev IS Docker Desktop, no `argocd cluster add` needed
    namespace: oms-core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  # Same reasoning as app-shipment-service.yaml — oms-worker is also
  # KEDA-scaled (see oms-main's own 07-scaledobject-worker.yaml), and
  # oms-web has its own separate native HorizontalPodAutoscaler
  # (05-hpa-web.yaml, CPU/memory-based, not KEDA). selfHeal must not fight
  # either autoscaler over /spec/replicas.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: oms-worker
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: oms-web
      jsonPointers:
        - /spec/replicas
