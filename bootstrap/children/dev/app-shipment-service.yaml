apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-shipment-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  project: apps
  source:
    repoURL: https://github.com/xgiri/oms-gitops.git
    targetRevision: main
    path: environments/dev/apps/shipment-service
  destination:
    name: in-cluster
    namespace: oms-core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  # KEDA's ScaledObject drives shipment-service-worker's replica count at
  # runtime, and shipment-service-web has its own separate native
  # HorizontalPodAutoscaler (CPU/memory-based, not KEDA) — without ignoring
  # both, Argo CD's selfHeal above keeps reverting each one's scaling back
  # to whatever's declared in git roughly every 15s (the HPA controller's
  # default reconcile interval), fighting both autoscalers instead of
  # letting either work.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: shipment-service-worker
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: shipment-service-web
      jsonPointers:
        - /spec/replicas
