apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-shipment-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  project: apps
  source:
    repoURL: https://github.com/xgiri/oms-gitops.git
    targetRevision: main
    path: environments/dev/apps/shipment-service
  destination:
    name: in-cluster
    namespace: oms-core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # KEDA's ScaledObject drives shipment-service-worker's replica count at
  # runtime — without this, Argo CD's selfHeal above would keep reverting
  # KEDA's scaling back to whatever's declared in git on every reconcile,
  # fighting the autoscaler instead of letting it work.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: shipment-service-worker
      jsonPointers:
        - /spec/replicas
