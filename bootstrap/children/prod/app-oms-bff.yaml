apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-oms-bff
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  project: apps
  source:
    repoURL: https://github.com/xgiri/oms-gitops.git
    targetRevision: main
    path: environments/prod/apps/oms-bff
  destination:
    name: prod
    namespace: oms-core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  # oms-bff has its own native HorizontalPodAutoscaler (CPU/memory-based) — selfHeal must not fight it over /spec/replicas.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: oms-bff
      jsonPointers:
        - /spec/replicas
