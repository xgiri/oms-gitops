apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-kafka
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: infra
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: kafka
      targetRevision: "31.0.0"
      helm:
        valueFiles:
          - $values/environments/prod/infra/kafka/values.yaml
    - repoURL: https://github.com/xgiri/gitops.git
      targetRevision: main
      ref: values
  destination:
    name: prod
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
