apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: infra
  sources:
    - repoURL: https://kedacore.github.io/charts
      chart: keda
      targetRevision: "2.16.0"
      helm:
        valueFiles:
          - $values/environments/prod/infra/keda/values.yaml
    - repoURL: https://github.com/xgiri/oms-gitops.git
      targetRevision: main
      ref: values
  destination:
    name: prod
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # See dev's infra-keda.yaml for the full explanation — KEDA's
      # scaledjobs.keda.sh CRD exceeds the 262144-byte annotation limit
      # under client-side apply. Server-side apply avoids it.
      - ServerSideApply=true
