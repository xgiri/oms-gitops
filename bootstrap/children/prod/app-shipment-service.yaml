apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-shipment-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  project: apps
  source:
    repoURL: https://github.com/xgiri/oms-gitops.git
    targetRevision: main
    path: environments/prod/apps/shipment-service
  destination:
    name: prod
    namespace: oms-core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  # See dev's app-shipment-service.yaml for the full explanation —
  # shipment-service-web has its own native HPA separate from KEDA, same
  # ignore-both-replicas fix applies here.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: shipment-service-worker
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: shipment-service-web
      jsonPointers:
        - /spec/replicas
