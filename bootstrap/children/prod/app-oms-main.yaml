apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-oms-main
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: apps
  source:
    repoURL: https://github.com/xgiri/oms-gitops.git
    targetRevision: main
    path: environments/prod/apps/oms-main
  destination:
    name: prod
    namespace: oms-core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: oms-worker
      jsonPointers:
        - /spec/replicas
