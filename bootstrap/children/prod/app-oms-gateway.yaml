apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-oms-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  project: apps
  source:
    repoURL: https://github.com/xgiri/oms-gitops.git
    targetRevision: main
    path: environments/prod/apps/oms-gateway
  destination:
    name: prod
    namespace: oms-core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  # oms-gateway has its own native HorizontalPodAutoscaler (CPU/memory-based) — selfHeal must not fight it over /spec/replicas.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: oms-gateway
      jsonPointers:
        - /spec/replicas
