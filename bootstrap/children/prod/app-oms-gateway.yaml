apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-oms-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  project: apps
  source:
    repoURL: https://github.com/xgiri/oms-gitops.git
    targetRevision: main
    path: environments/prod/apps/oms-gateway
  destination:
    name: prod
    namespace: oms-core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
