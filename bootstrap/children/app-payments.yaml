apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-payments
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"   # app tier starts only after all infra waves (-2..0) are Healthy
spec:
  project: apps
  source:
    repoURL: https://github.com/org/gitops.git
    targetRevision: main
    path: apps/overlays/prod/payments
  destination:
    server: https://kubernetes.default.svc
    namespace: payments
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
