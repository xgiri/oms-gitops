apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-shipment-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  project: apps
  source:
    repoURL: https://github.com/xgiri/oms-gitops.git
    targetRevision: main
    path: environments/test/apps/shipment-service
  destination:
    name: test
    namespace: oms-core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
