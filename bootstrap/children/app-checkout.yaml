apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-checkout
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"   # checkout calls payments, so it waits one wave behind it
spec:
  project: apps
  source:
    repoURL: https://github.com/org/gitops.git
    targetRevision: main
    path: apps/overlays/prod/checkout
  destination:
    server: https://kubernetes.default.svc
    namespace: checkout
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
