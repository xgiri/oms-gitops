apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-notifications
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"   # independent of payments/checkout, same wave as payments is fine
spec:
  project: apps
  source:
    repoURL: https://github.com/org/gitops.git
    targetRevision: main
    path: apps/overlays/prod/notifications
  destination:
    server: https://kubernetes.default.svc
    namespace: notifications
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
