apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: infra
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: "v1.16.2"
      helm:
        valueFiles:
          - $values/environments/uat/infra/cert-manager/values.yaml
    - repoURL: https://github.com/xgiri/gitops.git
      targetRevision: main
      ref: values
  destination:
    name: uat
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
