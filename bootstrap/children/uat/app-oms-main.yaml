apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-oms-main
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: apps
  source:
    repoURL: https://github.com/xgiri/oms-gitops.git
    targetRevision: main
    path: environments/uat/apps/oms-main
  destination:
    name: uat
    namespace: oms-core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
