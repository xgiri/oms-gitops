apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-redis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: infra
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: redis
      targetRevision: "20.2.1"
      helm:
        valueFiles:
          - $values/environments/uat/infra/redis/values.yaml
    - repoURL: https://github.com/xgiri/oms-gitops.git
      targetRevision: main
      ref: values
  destination:
    name: uat
    namespace: redis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
