# Apply once per environment/cluster:
#   kubectl apply -f bootstrap/root-test.yaml --context <your-test-context>
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-test
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/xgiri/gitops.git
    targetRevision: main
    path: bootstrap/children/test
  destination:
    name: test   # Argo CD cluster registered under this name: `argocd cluster add <context> --name test`
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
