# Apply this ONE file manually to bootstrap everything else:
#   kubectl apply -f bootstrap/root-app.yaml
# Argo CD then takes over and manages all children declared in bootstrap/children/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/org/gitops.git
    targetRevision: main
    path: bootstrap/children
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
