# Bitnami Redis chart. Standalone for dev/test (matches the single
# redis:7-alpine container docker-compose.yml runs); replicated for uat/prod.
architecture: standalone
replica:
  replicaCount: 0
auth:
  enabled: true
  # existingSecret populated by Vault Agent injection or the Vault CSI
  # driver, same source of truth the app itself reads REDIS_PASSWORD from
  # (see spring-cloud-vault, application-dev.properties) — never a plain
  # value committed here.
  existingSecret: redis-auth
master:
  persistence:
    enabled: true
    size: 2Gi
