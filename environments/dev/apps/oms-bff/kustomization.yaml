apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Remote base: oms-bff's OWN repo owns these manifests (source of truth lives
# there, not here). ?ref= pins which branch/tag this environment tracks —
# see README.md's "environment -> ref" table for why prod pins a release
# tag while dev tracks a branch.
resources:
  - https://github.com/xgiri/oms-bff//k8s?ref=main

images:
  - name: your-registry.example.com/oms-bff
    newName: your-registry.example.com/oms-bff
    newTag: REPLACE_ME   # set by CI at deploy time, e.g. `kustomize edit set image your-registry.example.com/oms-bff=your-registry.example.com/oms-bff:$GIT_SHA`

patches:
  - target:
      kind: ConfigMap
      name: oms-bff-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: "dev"
  - target:
      kind: Deployment
      name: oms-bff
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
