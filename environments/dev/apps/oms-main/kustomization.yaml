apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Remote base: oms-main's OWN repo owns these manifests (source of truth lives
# there, not here). ?ref= pins which branch/tag this environment tracks —
# see README.md's "environment -> ref" table for why prod pins a release
# tag while dev tracks a branch.
resources:
  - https://github.com/xgiri/oms-backend//k8s?ref=main

images:
  - name: your-registry.example.com/oms-main
    newName: your-registry.example.com/oms-main
    newTag: REPLACE_ME   # set by CI at deploy time, e.g. `kustomize edit set image your-registry.example.com/oms-main=your-registry.example.com/oms-main:$GIT_SHA`

patches:
  - target:
      kind: ConfigMap
      name: oms-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: "dev"
      - op: replace
        path: /data/DB_HOST
        value: "oms-main-db.dev.oms-rds.example.internal"
      - op: replace
        path: /data/VAULT_ADDR
        value: "http://vault.vault.svc.cluster.local:8200"
  - target:
      kind: Deployment
      name: oms-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: oms-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
