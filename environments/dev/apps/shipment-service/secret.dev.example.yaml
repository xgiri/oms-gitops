# NOT referenced by kustomization.yaml (same pattern as the upstream repo's
# own 01-secret.example.yaml) — copy this file, fill in the SAME
# DB_USERNAME/DB_PASSWORD your docker-compose .env already uses for
# shipment-service's Postgres, then apply the copy separately. Never commit
# real values, and never commit your filled-in copy either.
#
#   cp secret.dev.example.yaml secret.dev.yaml   # then edit + gitignore this
#   kubectl apply -f secret.dev.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: shipment-service-secrets
  namespace: oms-core
  labels:
    app.kubernetes.io/name: shipment-service
type: Opaque
stringData:
  DB_USERNAME: "REPLACE_WITH_YOUR_COMPOSE_DB_USERNAME"
  DB_PASSWORD: "REPLACE_WITH_YOUR_COMPOSE_DB_PASSWORD"
  # Only read by the worker's KEDA ScaledObject, which this dev overlay
  # deletes (see kustomization.yaml) — harmless to leave populated for
  # whenever KEDA gets installed in dev.
  OUTBOX_PG_CONNECTION: "postgresql://REPLACE_WITH_YOUR_COMPOSE_DB_USERNAME:REPLACE_WITH_YOUR_COMPOSE_DB_PASSWORD@host.docker.internal:5435/shipment_service?sslmode=disable"
