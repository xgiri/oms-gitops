apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Remote base: product-service's OWN repo owns these manifests (source of truth lives
# there, not here). ?ref= pins which branch/tag this environment tracks —
# see README.md's "environment -> ref" table for why prod pins a release
# tag while dev tracks a branch.
resources:
  - https://github.com/xgiri/oms-product-service//k8s?ref=release/test

images:
  - name: your-registry.example.com/product-service
    newName: your-registry.example.com/product-service
    newTag: REPLACE_ME   # set by CI at deploy time, e.g. `kustomize edit set image your-registry.example.com/product-service=your-registry.example.com/product-service:$GIT_SHA`

patches:
  - target:
      kind: ConfigMap
      name: product-service-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: "test"
      - op: replace
        path: /data/DB_HOST
        value: "product-service-db.test.oms-rds.example.internal"
      - op: replace
        path: /data/VAULT_ADDR
        value: "http://vault.vault.svc.cluster.local:8200"
  - target:
      kind: Deployment
      name: product-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
